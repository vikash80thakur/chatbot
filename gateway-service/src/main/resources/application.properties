spring.application.name=gateway-service


server.port=8080

# ================= ORGANIZATION SERVICE =================
spring.cloud.gateway.routes[0].id=organization-service
spring.cloud.gateway.routes[0].uri=${ORG_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/org/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/org/(?<segment>.*), /${segment}

# ================= CHATBOT SERVICE =================
spring.cloud.gateway.routes[1].id=chatbot-service
spring.cloud.gateway.routes[1].uri=${CHAT_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/chat/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/chat/?(?<segment>.*), /api/chat


# Below are for health endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always