{{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.chatbotService.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-chatbot-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    app: chatbot-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot-service
  endpoints:
  - port: metrics
    interval: {{ .Values.serviceMonitor.chatbotService.interval }}
    scrapeTimeout: {{ .Values.serviceMonitor.chatbotService.scrapeTimeout }}
    path: /actuator/prometheus
    {{- with .Values.serviceMonitor.chatbotService.relabelings }}
    relabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
