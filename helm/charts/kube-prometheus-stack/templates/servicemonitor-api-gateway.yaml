{{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.apiGateway.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    app: api-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  endpoints:
  - port: metrics
    interval: {{ .Values.serviceMonitor.apiGateway.interval }}
    scrapeTimeout: {{ .Values.serviceMonitor.apiGateway.scrapeTimeout }}
    path: /actuator/prometheus
    {{- with .Values.serviceMonitor.apiGateway.relabelings }}
    relabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
