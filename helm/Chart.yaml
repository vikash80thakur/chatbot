apiVersion: v2
name: chatbot-platform
description: Umbrella Helm chart for API Gateway + Organization + Chatbot
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:

  - name: postgresql
    version: 15.5.20
    repository: https://charts.bitnami.com/bitnami

  - name: kube-prometheus-stack
    version: 58.1.2
    repository: https://prometheus-community.github.io/helm-charts

  - name: api-gateway
    version: 0.1.0
    repository: "file://charts/api-gateway"
  - name: chatbot-service
    version: 0.1.0
    repository: "file://charts/chatbot-service"
  - name: organization-service
    version: 0.1.0
    repository: "file://charts/organization-service"